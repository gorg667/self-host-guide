<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="A comprehensive, opinionated, in-depth guide to self-hosting services on a home lab: hardware, networking, storage, containers, reverse proxies, VPNs, backups, monitoring, security, and hundreds of service reviews.">
<link rel="stylesheet" href="{{ROOT}}style.css">
<link rel="stylesheet" href="{{ROOT}}pygments.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230f766e'/%3E%3Crect x='20' y='24' width='60' height='14' rx='3' fill='%23fff'/%3E%3Crect x='20' y='43' width='60' height='14' rx='3' fill='%23fff' opacity='.8'/%3E%3Crect x='20' y='62' width='60' height='14' rx='3' fill='%23fff' opacity='.6'/%3E%3C/svg%3E">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}else{document.documentElement.setAttribute('data-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}}catch(e){}})();
</script>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button>
  <a class="brand" href="{{ROOT}}">{{SITE_TITLE}}</a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search the guide…  ( / )" autocomplete="off" aria-label="Search">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <div class="topbar-actions">
    <a class="icon-link" href="{{ROOT}}../SELF-HOSTING-GUIDE.md" title="Single-file Markdown version" data-md-link>MD</a>
    <a class="icon-link" href="{{REPO_URL}}" title="GitHub repository" target="_blank" rel="noopener">GitHub</a>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Chapters">
    <div class="sidebar-inner">
      <a class="sidebar-home" href="{{ROOT}}">Overview</a>
      {{SIDEBAR}}
    </div>
  </nav>

  <main class="content" id="content">
    <div class="meta">{{META}}</div>
    <article class="prose">
      {{CONTENT}}
    </article>
    {{PREVNEXT}}
    <footer class="footer">
      <span>Built {{BUILD_DATE}}. </span>
      <a href="{{EDIT_URL}}" target="_blank" rel="noopener">Edit this page</a> ·
      <a href="{{REPO_URL}}" target="_blank" rel="noopener">Source on GitHub</a> ·
      Content licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
    </footer>
  </main>

  <aside class="toc" aria-label="On this page">
    <div class="toc-inner">
      <div class="toc-title">On this page</div>
      {{TOC}}
    </div>
  </aside>
</div>

<button class="back-top" id="backTop" aria-label="Back to top" hidden>↑</button>
<script>window.__ROOT__ = "{{ROOT}}";</script>
<script src="{{ROOT}}app.js" defer></script>
<script type="module">
  if (document.querySelector('pre.mermaid')) {
    import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then(({default: mermaid}) => {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'loose' });
      mermaid.run({ nodes: document.querySelectorAll('pre.mermaid') });
    }).catch(() => {});
  }
</script>
</body>
</html>
